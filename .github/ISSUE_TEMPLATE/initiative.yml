name: Initiative
description: A portfolio-level outcome spanning a quarter or more; parent of Epics.
title: "[Initiative]: "
type: Initiative
body:
  - type: markdown
    attributes:
      value: |
        Initiatives sit at the top of the hierarchy: **Initiative > Epic > Feature / Task / Bug**. Add the Epics that deliver this outcome as **sub-issues**.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: The portfolio-level result, stated so anyone can tell whether it happened.
    validations:
      required: true
  - type: textarea
    id: why-now
    attributes:
      label: Why now
      description: The evidence and timing that make this the priority.
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: Success metrics
      description: Measurable signals and targets.
      value: |
        - [ ] 
    validations:
      required: true
  - type: dropdown
    id: quarter
    attributes:
      label: Target quarter
      options:
        - 2026 Q4
        - 2027 Q1
        - 2027 Q2
        - 2027 Q3
        - 2027 Q4
        - Later
    validations:
      required: true
  - type: textarea
    id: epics
    attributes:
      label: Epics
      description: Planned Epics (link them as sub-issues once created).
