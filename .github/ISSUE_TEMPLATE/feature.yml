name: Feature
description: Propose a new capability or a change to how something works.
title: "[Feature]: "
type: Feature
labels: ["needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected and what they cannot do today. Describe the need, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change. Sketches, flows or examples welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds, and why they fall short.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable conditions that make this done.
      value: |
        - [ ] 
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - iPhone (iOS)
        - iPad (iPadOS)
        - Mac (macOS)
        - Apple Watch (watchOS)
        - Android phone or tablet
        - Wear OS
        - Website (browser)
        - Worker / API
        - MCP server
        - Not platform-specific
  - type: textarea
    id: notes
    attributes:
      label: Links and notes
      description: Related issues, docs, designs or customer evidence.
